<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#005A9C">
<title>大谷翔平比賽追蹤</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #EEF2F6;
  --card-bg: #FFFFFF;
  --text: #14202B;
  --text-secondary: #566574;
  --text-tertiary: #8896A3;
  --border: rgba(20,32,43,0.10);
  --border-strong: rgba(20,32,43,0.28);
  --blue: #005A9C;
  --accent: #005A9C;
  --accent-text: #005A9C;
  --info-bg: #E3EEF8;
  --info-text: #0B3F6B;
  --success-bg: #E1F3EA;
  --success-text: #1E7F4F;
  --danger-bg: #FCE9E8;
  --danger-text: #C2312D;
  --warning-bg: #FBF0D9;
  --warning-text: #9A6410;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1114;
    --card-bg: #1A1D21;
    --text: #F1F3F5;
    --text-secondary: #A2ACB6;
    --text-tertiary: #6C7681;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.28);
    --accent-text: #6DB5EB;
    --info-bg: #12324F;
    --info-text: #9CCBF2;
    --success-bg: #16382A;
    --success-text: #5CC796;
    --danger-bg: #4A1F1E;
    --danger-text: #F26B66;
    --warning-bg: #43330F;
    --warning-text: #E6B04A;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: calc(68px + env(safe-area-inset-bottom));
  font-variant-numeric: tabular-nums;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; }

.hero {
  background: var(--blue);
  color: #fff;
  padding: calc(14px + env(safe-area-inset-top)) 18px 18px;
  position: relative;
  overflow: hidden;
}
.hero-mark {
  position: absolute; right: 6px; top: -6px;
  font-size: 104px; font-weight: 600; line-height: 1;
  color: #0F68AB; pointer-events: none; user-select: none;
}
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; }
.hero-name { font-size: 18px; font-weight: 600; }
.hero-sub { font-size: 12px; color: #CFE3F4; margin-top: 2px; }
.hero-btns { display: flex; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.12);
  color: #fff; cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.active { background: #fff; color: var(--blue); border-color: #fff; }
.icon-btn:active { transform: scale(0.95); }
.icon-btn:disabled { opacity: 0.5; }
.hero-stats { display: flex; gap: 26px; margin-top: 16px; position: relative; }
.hero-stat-label { font-size: 11px; color: #CFE3F4; }
.hero-stat-num { font-size: 32px; font-weight: 600; line-height: 1.15; }

.panel { display: none; padding: 14px 14px 4px; }
.panel.active { display: block; }
.card {
  background: var(--card-bg);
  border: 0.5px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.panel-title { font-size: 15px; font-weight: 600; margin: 2px 2px 2px; }
.panel-sub { font-size: 12px; color: var(--text-secondary); margin: 0 2px 12px; }
.chip {
  display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px;
  background: var(--info-bg); color: var(--info-text); margin-left: 6px; font-weight: 500;
}
.chip-live { background: var(--danger-bg); color: var(--danger-text); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--card-bg); border-top: 0.5px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar-inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab {
  background: none; border: none; color: var(--text-secondary); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 0 8px; font-size: 11px;
}
.tab svg { width: 22px; height: 22px; }
.tab.active { color: var(--accent-text); font-weight: 600; }

.live-card {
  background: var(--card-bg); border: 0.5px solid var(--border);
  border-radius: 14px; padding: 14px; margin-bottom: 12px;
}
.live-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.live-tag {
  background: var(--danger-bg); color: var(--danger-text);
  font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
.inning-info { font-size: 13px; color: var(--text-secondary); }
.live-score-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.team-name { font-size: 13px; color: var(--text-secondary); }
.team-score { font-size: 44px; font-weight: 600; line-height: 1.1; }
.team-block.right { text-align: right; }
.diamond { width: 64px; height: 64px; }
.diamond .base { fill: var(--bg); stroke: var(--border-strong); stroke-width: 1; }
.diamond .base.on { fill: var(--blue); stroke: var(--blue); }
.bso {
  display: flex; justify-content: space-between;
  margin-top: 12px; padding-top: 10px; border-top: 0.5px solid var(--border);
  font-size: 13px; align-items: center;
}
.bso-group { display: flex; align-items: center; gap: 4px; }
.bso-label { color: var(--text-secondary); margin-right: 4px; }
.lamp { width: 11px; height: 11px; border-radius: 50%; background: var(--border-strong); display: inline-block; }
.lamp.b.on { background: var(--success-text); }
.lamp.s.on { background: var(--warning-text); }
.lamp.o.on { background: var(--danger-text); }
.people { margin-top: 12px; font-size: 13px; line-height: 1.9; }
.people-label { display: inline-block; width: 48px; color: var(--text-secondary); }
.ohtani-box { margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); }
.ohtani-head { display: flex; align-items: center; font-size: 15px; font-weight: 600; }
.ohtani-line { font-size: 21px; font-weight: 600; margin: 8px 0 2px; }
.ohtani-live-stats { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.ohtani-live-title { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.ohtani-live-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 4px; }
.live-stat-cell { text-align: center; }
.live-stat-num { font-size: 17px; font-weight: 600; }
.live-stat-lbl { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
.timeline { margin: 14px 0 2px 5px; padding-left: 16px; border-left: 1px solid var(--border-strong); }
.tl-title { font-size: 12px; color: var(--text-secondary); margin: 14px 0 0; }
.tl-item { position: relative; display: flex; gap: 10px; align-items: baseline; padding: 4px 0 10px; font-size: 13px; }
.tl-item::before {
  content: ""; position: absolute; left: -21px; top: 10px;
  width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong);
}
.tl-item.pa-result-hit::before, .tl-item.pa-result-walk::before { background: var(--blue); }
.tl-item.pa-result-hr::before { background: var(--warning-text); }
.tl-when { width: 44px; color: var(--text-secondary); flex-shrink: 0; }
.tl-what { color: var(--text-secondary); }
.tl-item.pa-result-hit .tl-what, .tl-item.pa-result-walk .tl-what { color: var(--accent-text); font-weight: 500; }
.tl-item.pa-result-hr .tl-what { color: var(--warning-text); font-weight: 600; }
.tl-rbi { font-size: 12px; color: var(--text-secondary); }

.next-game-card {
  background: var(--card-bg); border: 0.5px solid var(--border);
  border-radius: 14px; padding: 14px; margin-bottom: 12px;
}
.next-game-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.next-game-matchup { font-size: 19px; font-weight: 600; }
.countdown-row { display: flex; gap: 8px; margin-top: 12px; }
.countdown-cell { flex: 1; background: var(--info-bg); border-radius: 10px; padding: 10px 4px; text-align: center; }
.countdown-num { font-size: 26px; font-weight: 600; line-height: 1.1; color: var(--info-text); }
.countdown-unit { font-size: 11px; color: var(--info-text); margin-top: 2px; }
.next-game-time { font-size: 12px; color: var(--text-secondary); margin-top: 10px; }
.pitcher-matchup { display: flex; gap: 8px; margin-top: 12px; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.pitcher-side { flex: 1; min-width: 0; }
.pitcher-side.right { text-align: right; }
.pitcher-team { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
.pitcher-name { font-size: 13px; font-weight: 600; line-height: 1.3; word-break: break-word; }
.pitcher-record { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.pitcher-vs { display: flex; align-items: center; font-size: 11px; color: var(--text-tertiary); }

.player-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.avatar {
  width: 44px; height: 44px; border-radius: 50%; background: var(--blue); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px;
}
.player-info { flex: 1; }
.player-name { font-weight: 600; font-size: 16px; }
.player-pos { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.badge { font-size: 12px; padding: 4px 10px; border-radius: 8px; font-weight: 500; }
.badge-win { background: var(--success-bg); color: var(--success-text); }
.badge-loss { background: var(--danger-bg); color: var(--danger-text); }
.score-box { background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; }
.score-row { display: flex; justify-content: space-between; align-items: center; }
.score-num { font-weight: 600; font-size: 20px; }
.score-vs { color: var(--text-tertiary); font-size: 12px; }
.score-date { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; text-align: center; }
.section-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 4px 0 10px; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.stats-grid:last-child { margin-bottom: 0; }
.stat-cell { background: var(--bg); border-radius: 10px; padding: 10px 4px; text-align: center; }
.stat-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }
.stat-value { font-size: 19px; font-weight: 600; }
.stat-value.highlight { color: var(--success-text); }
.pitcher-table { width: 100%; font-size: 13px; border-collapse: collapse; }
.pitcher-table td { padding: 6px 0; border-bottom: 0.5px solid var(--border); }
.pitcher-table tr:last-child td { border-bottom: none; }
.pitcher-table td:first-child { color: var(--text-secondary); }
.pitcher-table td:last-child { text-align: right; }
.highlight-box { background: var(--info-bg); border-radius: 10px; padding: 10px 14px; margin-top: 14px; font-size: 12px; color: var(--info-text); line-height: 1.6; }
.note { font-size: 12px; color: var(--text-tertiary); margin-top: 12px; }

.seg-row { display: flex; gap: 8px; margin-bottom: 14px; }
.seg {
  flex: 1; padding: 9px; border-radius: 10px; font-size: 14px; cursor: pointer;
  background: var(--card-bg); color: var(--text-secondary); border: 0.5px solid var(--border-strong);
}
.seg.active { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }
.season-view { display: none; }
.season-view.active { display: block; }
.metric-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.metric { background: var(--card-bg); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.metric-label { font-size: 12px; color: var(--text-secondary); }
.metric-num { font-size: 32px; font-weight: 600; line-height: 1.2; }
.bar-block { margin-bottom: 12px; }
.bar-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.bar { height: 7px; border-radius: 4px; background: var(--border); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }
.kv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; margin: 14px 0 6px; }
.kv { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 0.5px solid var(--border); font-size: 14px; }
.kv span:first-child { color: var(--text-secondary); }
.kv span:last-child { font-weight: 600; }
.sub-head { font-size: 14px; font-weight: 600; margin: 20px 2px 10px; }

.chart { display: flex; align-items: flex-end; gap: 10px; height: 110px; margin: 4px 0 6px; }
.chart-col { flex: 1; text-align: center; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.chart-val { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
.chart-bar { border-radius: 5px 5px 0 0; background: var(--border-strong); min-height: 4px; }
.chart-bar.win { background: var(--blue); }
.chart-date { font-size: 11px; color: var(--text-secondary); margin-top: 5px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--border-strong); }
.legend i.win { background: var(--blue); }

.history-row {
  display: flex; align-items: center; gap: 10px; padding: 11px 0;
  border-bottom: 0.5px solid var(--border); font-size: 13px; cursor: pointer; user-select: none;
}
.history-row:active { opacity: 0.6; }
.history-row:last-child { border-bottom: none; }
.history-date { flex-shrink: 0; width: 40px; color: var(--text-secondary); font-size: 12px; }
.history-matchup { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-result { flex-shrink: 0; width: 64px; text-align: right; font-weight: 500; }
.history-result.win { color: var(--success-text); }
.history-result.loss { color: var(--danger-text); }
.history-stats { flex-shrink: 0; color: var(--text-secondary); font-size: 12px; min-width: 56px; text-align: right; }
.history-stats.highlight { color: var(--success-text); font-weight: 600; }
.history-dnp { color: var(--text-tertiary); font-style: italic; font-size: 11px; }
.history-arrow { flex-shrink: 0; width: 14px; color: var(--text-tertiary); font-size: 11px; text-align: center; transition: transform 0.2s; }
.history-arrow.open { transform: rotate(180deg); }
.history-detail { display: none; padding: 4px 0 14px; border-bottom: 0.5px solid var(--border); }
.history-detail.open { display: block; }
.history-detail-card { background: var(--bg); border-radius: 12px; padding: 14px; }
.history-detail .section-label { margin-top: 12px; }
.history-detail .section-label:first-child { margin-top: 0; }
.history-loading { text-align: center; padding: 16px; color: var(--text-tertiary); font-size: 12px; }

.loading, .error { text-align: center; padding: 48px 20px; color: var(--text-secondary); font-size: 14px; }
.error { color: var(--danger-text); }
.spinner {
  display: inline-block; width: 22px; height: 22px; margin-bottom: 12px;
  border: 2px solid var(--border-strong); border-top-color: var(--blue);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.updated { text-align: center; font-size: 11px; color: var(--text-tertiary); margin: 4px 14px 18px; }
.auto-refresh-indicator {
  display: inline-block; width: 8px; height: 8px; background: var(--success-text);
  border-radius: 50%; margin-right: 5px; animation: pulse 2s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  .live-tag, .auto-refresh-indicator, .spinner { animation: none; }
  .history-arrow { transition: none; }
}
</style>
</head>
<body>
<div class="app">

  <header class="hero">
    <div class="hero-mark" aria-hidden="true">17</div>
    <div class="hero-top">
      <div>
        <h1 class="hero-name">大谷翔平</h1>
        <div class="hero-sub" id="heroSub">道奇　背號 17</div>
      </div>
      <div class="hero-btns">
        <button class="icon-btn" id="notifBtn" onclick="toggleNotifications()" aria-label="比賽通知"></button>
        <button class="icon-btn" id="refreshBtn" onclick="loadAll()" aria-label="重新整理">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4"/></svg>
        </button>
      </div>
    </div>
    <div class="hero-stats" id="heroStats">
      <div><div class="hero-stat-label">打擊率</div><div class="hero-stat-num">--</div></div>
      <div><div class="hero-stat-label">OPS</div><div class="hero-stat-num">--</div></div>
      <div><div class="hero-stat-label">全壘打</div><div class="hero-stat-num">--</div></div>
    </div>
  </header>

  <main id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>正在抓取最新比賽數據...</div>
    </div>
  </main>

  <div class="updated" id="updated"></div>

</div>

<nav class="tabbar" aria-label="主要分頁">
  <div class="tabbar-inner">
    <button class="tab" id="tab-today" onclick="showTab('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 6.5c2.6 1.6 4 3.3 4 5.5s-1.4 3.9-4 5.5M18.4 6.5c-2.6 1.6-4 3.3-4 5.5s1.4 3.9 4 5.5"/></svg>
      今日
    </button>
    <button class="tab" id="tab-stats" onclick="showTab('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="6" width="4" height="14" rx="1"/><rect x="16" y="9" width="4" height="11" rx="1"/></svg>
      數據
    </button>
    <button class="tab" id="tab-history" onclick="showTab('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4h4"/><path d="M12 8v4.5l3 1.8"/></svg>
      歷史
    </button>
  </div>
</nav>

<script>
const PLAYER_ID = 660271;
const TEAM_ID = 119;
const SEASON = new Date().getFullYear();
const LIVE_REFRESH_MS = 30000; // 30 秒

let countdownInterval = null;
let liveRefreshInterval = null;
let currentLiveGamePk = null;

// 通知相關狀態
let notificationsEnabled = false;
let prevOhtaniState = {
  initialized: false,
  gamePk: null,
  isBatting: false,
  hits: 0,
  homeRuns: 0
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed:', err));
  });
}

// ── 通知相關函數 ──────────────────────────────

async function toggleNotifications() {
  // 如果瀏覽器不支援通知
  if (!('Notification' in window)) {
    alert('你的瀏覽器不支援通知功能，請使用 Chrome 瀏覽器。');
    return;
  }

  if (notificationsEnabled) {
    // 關閉通知
    notificationsEnabled = false;
    updateNotifBtn();
    return;
  }

  // 開啟通知：先確認或請求權限
  if (Notification.permission === 'granted') {
    notificationsEnabled = true;
    updateNotifBtn();
    showTestNotification();
  } else if (Notification.permission === 'denied') {
    alert('你已封鎖此網站的通知。\n\n請到 Chrome 設定 → 網站設定 → 通知，允許此網站的通知後再試。');
  } else {
    const permission = await Notification.requestPermission();
    if (permission === 'granted') {
      notificationsEnabled = true;
      updateNotifBtn();
      showTestNotification();
    } else {
      alert('未取得通知權限，無法發送通知。');
    }
  }
}

const ICON_BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
const ICON_BELL_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m3 3 18 18"/></svg>';

function updateNotifBtn() {
  const btn = document.getElementById('notifBtn');
  if (!btn) return;
  if (notificationsEnabled) {
    btn.innerHTML = ICON_BELL;
    btn.classList.add('active');
    btn.title = '通知已開啟（點擊關閉）';
    btn.setAttribute('aria-label', '通知已開啟，點擊關閉');
  } else {

    btn.classList.remove('active');

function showTestNotification() {
  sendOhtaniNotification(
    '✅ 大谷追蹤通知已開啟',
    '大谷輪到打擊、擊出安打或全壘打時，你會收到通知。'
  );
}

function sendOhtaniNotification(title, body) {
  if (!notificationsEnabled || Notification.permission !== 'granted') return;
  try {
    const notif = new Notification(title, {
      body,
      icon: 'icon-192.png',
      badge: 'icon-192.png',
      vibrate: [200, 100, 200],
      tag: 'ohtani-live',
      renotify: true,
    });
    setTimeout(() => notif.close(), 10000);
    // 點通知後把視窗帶到前景
    notif.onclick = () => { window.focus(); notif.close(); };
  } catch (err) {
    console.log('Notification error:', err);
  }
}

function checkAndNotify(gamePk, isBatting, hits, homeRuns) {
  if (!notificationsEnabled) return;

  // 第一次看到這場比賽：初始化，不送通知
  if (!prevOhtaniState.initialized || prevOhtaniState.gamePk !== gamePk) {
    prevOhtaniState = {
      initialized: true,
      gamePk,
      isBatting,
      hits: hits ?? 0,
      homeRuns: homeRuns ?? 0
    };
    return;
  }

  const prevHits = prevOhtaniState.hits ?? 0;
  const prevHR = prevOhtaniState.homeRuns ?? 0;
  const currentHits = hits ?? 0;
  const currentHR = homeRuns ?? 0;

  // 全壘打（先判斷，比安打更優先）
  if (currentHR > prevHR) {
    sendOhtaniNotification(
      '💥 大谷翔平全壘打！',
      `本場第 ${currentHR} 支全壘打！`
    );
  } else if (currentHits > prevHits) {
    // 安打（非全壘打）
    sendOhtaniNotification(
      '🥎 大谷翔平擊出安打！',
      `本場第 ${currentHits} 支安打！`
    );
  }

  // 輪到大谷打擊（且之前不是他打）
  if (isBatting && !prevOhtaniState.isBatting) {
    sendOhtaniNotification(
      '⭐ 大谷翔平上場打擊！',
      '大谷現在站上打擊區，準備迎戰！'
    );
  }

  // 更新狀態
  prevOhtaniState.isBatting = isBatting;
  prevOhtaniState.hits = currentHits;
  prevOhtaniState.homeRuns = currentHR;
}

let currentTab = 'today';

function showTab(name) {
  currentTab = name;
  ['today', 'stats', 'history'].forEach(t => {
    const panel = document.getElementById('panel-' + t);
    if (panel) panel.classList.toggle('active', t === name);
    const tab = document.getElementById('tab-' + t);
    if (tab) {
      tab.classList.toggle('active', t === name);
      tab.setAttribute('aria-current', t === name ? 'page' : 'false');
    }
  });
  window.scrollTo(0, 0);
}

async function loadAll() {
  if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  if (liveRefreshInterval) { clearInterval(liveRefreshInterval); liveRefreshInterval = null; }
  currentLiveGamePk = null;
  prevOhtaniState.initialized = false;

  const content = document.getElementById('content');
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.disabled = true;
  content.innerHTML = '<div class="loading"><div class="spinner"></div><div>正在抓取最新比賽數據...</div></div>';

  try {
    const today = new Date();
    const fmt = d => d.toISOString().split('T')[0];

    const past = new Date(today);
    past.setDate(today.getDate() - 30);
    const future = new Date(today);
    future.setDate(today.getDate() + 14);

    const scheduleUrl = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${TEAM_ID}&startDate=${fmt(past)}&endDate=${fmt(future)}&hydrate=team,probablePitcher`;
    const regularStatsUrl = `https://statsapi.mlb.com/api/v1/people/${PLAYER_ID}/stats?stats=season&season=${SEASON}&group=hitting,pitching&gameType=R`;
    const postseasonStatsUrl = `https://statsapi.mlb.com/api/v1/people/${PLAYER_ID}/stats?stats=season&season=${SEASON}&group=hitting,pitching&gameType=P`;

    const [scheduleRes, regularStatsRes, postseasonStatsRes] = await Promise.all([
      fetch(scheduleUrl),
      fetch(regularStatsUrl),
      fetch(postseasonStatsUrl).catch(() => null)
    ]);
    const schedule = await scheduleRes.json();
    const regularStats = await regularStatsRes.json();
    const postseasonStats = postseasonStatsRes ? await postseasonStatsRes.json() : null;

    let lastFinishedGame = null;
    let nextGame = null;
    let liveGame = null;
    let finishedGames = [];
    const nowMs = today.getTime();

    for (const day of schedule.dates) {
      for (const game of day.games) {
        const gameTime = new Date(game.gameDate).getTime();
        const state = game.status.detailedState;
        const coded = game.status.codedGameState;

        if (coded === 'I' || state === 'In Progress' || state === 'Manager challenge' || state === 'Replay') {
          liveGame = game;
        } else if (state === 'Final' || coded === 'F') {
          finishedGames.push(game);
          if (!lastFinishedGame || gameTime > new Date(lastFinishedGame.gameDate).getTime()) {
            lastFinishedGame = game;
          }
        } else if (gameTime > nowMs || coded === 'P' || state === 'Pre-Game' || state === 'Warmup' || state === 'Scheduled') {
          if (!nextGame || gameTime < new Date(nextGame.gameDate).getTime()) {
            nextGame = game;
          }
        }
      }
    }

    finishedGames.sort((a, b) => new Date(b.gameDate).getTime() - new Date(a.gameDate).getTime());
    const historyGames = finishedGames.slice(0, 5);

    // 今日分頁：即時比賽或下一場，加上最近一場
    let todayHtml = '';
    if (liveGame) {
      todayHtml += await renderLiveGame(liveGame);
      currentLiveGamePk = liveGame.gamePk;
    } else if (nextGame) {
      todayHtml += await renderNextGame(nextGame);
    }
    if (lastFinishedGame) {
      todayHtml += await renderLastGame(lastFinishedGame);
    } else if (!liveGame) {
      todayHtml += '<div class="card"><div class="error" style="padding:20px;">最近 30 天內找不到道奇隊已結束的比賽</div></div>';
    }

    // 數據分頁與歷史分頁
    const statsHtml = renderSeasonStats(regularStats, postseasonStats);
    const historyHtml = historyGames.length > 0
      ? await renderRecentHistory(historyGames)
      : '<div class="card"><div class="error" style="padding:20px;">最近 30 天沒有已結束的比賽</div></div>';

    content.innerHTML = `
      <section class="panel" id="panel-today">${todayHtml}</section>
      <section class="panel" id="panel-stats">${statsHtml}</section>
      <section class="panel" id="panel-history">${historyHtml}</section>
    `;
    renderHeroStats(regularStats, postseasonStats);
    showTab(currentTab);

    if (nextGame && !liveGame) {
      startCountdown(nextGame);
    }
    if (liveGame) {
      liveRefreshInterval = setInterval(() => refreshLiveGame(currentLiveGamePk), LIVE_REFRESH_MS);
    }

    updateTimestamp(!!liveGame);

  } catch (err) {
    content.innerHTML = `<div class="error">載入失敗：${err.message}<br><br>請檢查網路連線後再試一次</div>`;
    console.error(err);
  } finally {
    refreshBtn.disabled = false;
  }
}

function updateTimestamp(isLive) {
  const now = new Date();
  const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  const liveIndicator = isLive ? '<span class="auto-refresh-indicator"></span>每 30 秒自動更新中 · ' : '';
  document.getElementById('updated').innerHTML = `${liveIndicator}資料更新於 ${timeStr} · 來源：MLB Stats API`;
}

async function refreshLiveGame(gamePk) {
  if (!gamePk) return;
  try {
    const liveCard = document.getElementById('liveCard');
    if (!liveCard) {
      // 即時卡片不見了，重新整體載入
      loadAll();
      return;
    }
    const newHtml = await renderLiveGame({ gamePk });
    // 替換即時卡片內容
    const temp = document.createElement('div');
    temp.innerHTML = newHtml;
    const newCard = temp.querySelector('#liveCard');
    if (newCard) {
      liveCard.replaceWith(newCard);
    } else {
      // 比賽結束了，整體重整
      loadAll();
      return;
    }
    updateTimestamp(true);
  } catch (err) {
    console.log('Live refresh failed:', err);
  }
}

async function renderLiveGame(game) {
  const gamePk = game.gamePk;
  const [feedRes, boxRes] = await Promise.all([
    fetch(`https://statsapi.mlb.com/api/v1.1/game/${gamePk}/feed/live`),
    fetch(`https://statsapi.mlb.com/api/v1/game/${gamePk}/boxscore`)
  ]);
  const feed = await feedRes.json();
  const boxscore = await boxRes.json();

  const liveData = feed.liveData || {};
  const linescore = liveData.linescore || {};
  const plays = liveData.plays || {};
  const currentPlay = plays.currentPlay || {};

  const gameData = feed.gameData || {};
  const teams = gameData.teams || {};
  const homeTeam = teams.home || {};
  const awayTeam = teams.away || {};
  const isDodgersHome = homeTeam.id === TEAM_ID;
  const opponentTeam = isDodgersHome ? awayTeam : homeTeam;

  // 比分
  const homeScore = linescore.teams?.home?.runs ?? 0;
  const awayScore = linescore.teams?.away?.runs ?? 0;
  const dodgersScore = isDodgersHome ? homeScore : awayScore;
  const opponentScore = isDodgersHome ? awayScore : homeScore;

  // 局數
  const inning = linescore.currentInning ?? 1;
  const inningHalf = linescore.inningHalf || 'Top'; // Top or Bottom
  const inningHalfZh = inningHalf === 'Top' ? '上' : '下';

  // 出局數、好壞球
  const outs = linescore.outs ?? 0;
  const balls = linescore.balls ?? 0;
  const strikes = linescore.strikes ?? 0;

  // 壘上跑者
  const offense = linescore.offense || {};
  const onFirst = !!offense.first;
  const onSecond = !!offense.second;
  const onThird = !!offense.third;

  // 當前打者
  const currentBatter = offense.batter || currentPlay?.matchup?.batter || null;
  const batterName = currentBatter?.fullName || '';
  const isOhtaniBatting = currentBatter?.id === PLAYER_ID;

  // 下一棒打者
  const onDeckBatter = offense.onDeck || null;
  const onDeckName = onDeckBatter?.fullName || '';
  const isOhtaniOnDeck = onDeckBatter?.id === PLAYER_ID;

  // 當前投手
  const defense = linescore.defense || {};
  const currentPitcher = defense.pitcher || currentPlay?.matchup?.pitcher || null;
  const pitcherName = currentPitcher?.fullName || '';
  const currentPitcherId = currentPitcher?.id || null;

  // 從 boxscore 取得當前投手的用球數
  let pitchCount = null;
  if (currentPitcherId) {
    const pitcherKey = `ID${currentPitcherId}`;
    const allPlayers = {
      ...boxscore.teams.home.players,
      ...boxscore.teams.away.players
    };
    const pitcherData = allPlayers?.[pitcherKey];
    if (pitcherData?.stats?.pitching?.numberOfPitches != null) {
      pitchCount = pitcherData.stats.pitching.numberOfPitches;
    }
  }

  // 大谷對當前投手的歷史對戰紀錄（只在大谷正在打擊時才抓）
  let vsPitcherHtml = '';
  if (isOhtaniBatting && currentPitcherId) {
    try {
      const vsUrl = `https://statsapi.mlb.com/api/v1/people/${PLAYER_ID}/stats?stats=vsPlayer&group=hitting&opposingPlayerId=${currentPitcherId}&sportId=1`;
      const vsRes = await fetch(vsUrl);
      const vsData = await vsRes.json();

      // vsPlayer 會回傳生涯+本季多個 splits，找「career」那個
      let careerVs = null;
      if (vsData.stats) {
        for (const group of vsData.stats) {
          if (group.splits?.length > 0) {
            // 通常第一個 split 是生涯對戰
            careerVs = group.splits[0].stat;
            break;
          }
        }
      }

      if (careerVs && (careerVs.atBats > 0 || careerVs.plateAppearances > 0)) {
        const vAB = careerVs.atBats ?? 0;
        const vH = careerVs.hits ?? 0;
        const vHR = careerVs.homeRuns ?? 0;
        const vRBI = careerVs.rbi ?? 0;
        const vK = careerVs.strikeOuts ?? 0;
        const vBB = careerVs.baseOnBalls ?? 0;
        const vAVG = vAB > 0 ? (vH / vAB).toFixed(3).replace(/^0/, '') : '-';

        vsPitcherHtml = `
          <div class="ohtani-live-stats">
            <div class="ohtani-live-title">生涯對 ${pitcherName}</div>
            <div class="ohtani-live-grid">
              <div class="live-stat-cell"><div class="live-stat-num">${vAVG}</div><div class="live-stat-lbl">打擊率</div></div>
              <div class="live-stat-cell"><div class="live-stat-num">${vAB}</div><div class="live-stat-lbl">打數</div></div>
              <div class="live-stat-cell"><div class="live-stat-num">${vH}</div><div class="live-stat-lbl">安打</div></div>
              <div class="live-stat-cell"><div class="live-stat-num">${vHR}</div><div class="live-stat-lbl">全壘打</div></div>
              <div class="live-stat-cell"><div class="live-stat-num">${vRBI}</div><div class="live-stat-lbl">打點</div></div>
              <div class="live-stat-cell"><div class="live-stat-num">${vK}</div><div class="live-stat-lbl">三振</div></div>
              <div class="live-stat-cell"><div class="live-stat-num">${vBB}</div><div class="live-stat-lbl">四壞</div></div>
            </div>
          </div>
        `;
      } else {
        vsPitcherHtml = `
          <div class="ohtani-live-stats" style="text-align:center; padding:14px;">
            <div style="font-size:12px; opacity:0.85;">大谷與 ${pitcherName} 過去無對戰紀錄</div>
          </div>
        `;
      }
    } catch (err) {
      console.log('vsPitcher fetch failed:', err);
    }
  }

  // 大谷本場數據
  const dodgersData = isDodgersHome ? boxscore.teams.home : boxscore.teams.away;
  const ohtaniKey = `ID${PLAYER_ID}`;
  const ohtani = dodgersData?.players?.[ohtaniKey];
  const batting = ohtani?.stats?.batting || {};
  const pitching = ohtani?.stats?.pitching || {};

  // 大谷本場逐打席結果
  let plateAppearancesHtml = '';
  const allPlays = plays.allPlays || [];
  const ohtaniPlays = allPlays.filter(p =>
    p.matchup?.batter?.id === PLAYER_ID && p.result?.event
  );

  if (ohtaniPlays.length > 0) {
    const paItems = ohtaniPlays.map(play => {
      const event = translateEvent(play.result.eventType);
      const rbiPA = play.result.rbi ?? 0;
      const inningPA = play.about?.inning ?? '?';
      const halfPA = play.about?.halfInning === 'top' ? '上' : '下';
      return `<div class="tl-item ${event.cls}"><span class="tl-when">${inningPA}局${halfPA}</span><span class="tl-what">${event.text}</span>${rbiPA > 0 ? `<span class="tl-rbi">RBI ${rbiPA}</span>` : ''}</div>`;
    }).join('');
    plateAppearancesHtml = `<div class="tl-title">逐打席</div><div class="timeline">${paItems}</div>`;
  }

  const ab = batting.atBats ?? 0;
  const h = batting.hits ?? 0;
  const hr = batting.homeRuns ?? 0;
  const rbi = batting.rbi ?? 0;
  const r = batting.runs ?? 0;
  const k = batting.strikeOuts ?? 0;
  const bb = batting.baseOnBalls ?? 0;
  const avg = ab > 0 ? (h / ab).toFixed(3).replace(/^0/, '') : '-';

  // 檢查是否需要發送通知
  checkAndNotify(gamePk, isOhtaniBatting, h, hr);

  // 大谷投球（如果他在投）
  let ohtaniPitchingHtml = '';
  if (pitching && Object.keys(pitching).length > 0) {
    const ip = pitching.inningsPitched ?? '0';
    const pK = pitching.strikeOuts ?? 0;
    const pBB = pitching.baseOnBalls ?? 0;
    const pH = pitching.hits ?? 0;
    const pER = pitching.earnedRuns ?? 0;
    ohtaniPitchingHtml = `
      <div class="ohtani-live-stats">
        <div class="ohtani-live-title">本場投球</div>
        <div class="ohtani-live-grid">
          <div class="live-stat-cell"><div class="live-stat-num">${ip}</div><div class="live-stat-lbl">局數</div></div>
          <div class="live-stat-cell"><div class="live-stat-num">${pK}</div><div class="live-stat-lbl">三振</div></div>
          <div class="live-stat-cell"><div class="live-stat-num">${pBB}</div><div class="live-stat-lbl">四壞</div></div>
          <div class="live-stat-cell"><div class="live-stat-num">${pH}</div><div class="live-stat-lbl">被安</div></div>
          <div class="live-stat-cell"><div class="live-stat-num">${pER}</div><div class="live-stat-lbl">自責</div></div>
        </div>
      </div>
    `;
  }

  const opponentZh = translateTeam(opponentTeam.name);
  const venueText = isDodgersHome ? '主場' : '客場';

  const lamps = (n, total, cls) =>
    Array.from({ length: total }, (_, i) => `<i class="lamp ${cls}${i < n ? ' on' : ''}"></i>`).join('');
  const runnersLabel = [onFirst && '一壘', onSecond && '二壘', onThird && '三壘'].filter(Boolean).join('、') || '無人';

  const peopleHtml = (batterName || onDeckName || pitcherName) ? `
    <div class="people">
      ${batterName ? `<div><span class="people-label">打擊</span>${batterName}${isOhtaniBatting ? '<span class="chip">大谷</span>' : ''}</div>` : ''}
      ${onDeckName ? `<div><span class="people-label">下一棒</span>${onDeckName}${isOhtaniOnDeck ? '<span class="chip">大谷</span>' : ''}</div>` : ''}
      ${pitcherName ? `<div><span class="people-label">投手</span>${pitcherName}${pitchCount !== null ? `　${pitchCount} 球` : ''}</div>` : ''}
    </div>
  ` : '';

  const ohtaniHeadline = (ab === 0 && bb === 0)
    ? '尚未打擊'
    : `${ab} 打數 ${h} 安打${hr > 0 ? ` ${hr} 全壘打` : ''}${rbi > 0 ? ` ${rbi} 打點` : ''}`;

  const ohtaniStatusChip = isOhtaniBatting
    ? '<span class="chip chip-live">打擊中</span>'
    : (isOhtaniOnDeck ? '<span class="chip">下一棒</span>' : '');

  const ohtaniBoxHtml = ohtani ? `
    <div class="ohtani-box">
      <div class="ohtani-head">大谷 本場${ohtaniStatusChip}</div>
      <div class="ohtani-line">${ohtaniHeadline}</div>
      ${vsPitcherHtml}
      <div class="ohtani-live-stats">
        <div class="ohtani-live-grid">
          <div class="live-stat-cell"><div class="live-stat-num">${ab}</div><div class="live-stat-lbl">打數</div></div>
          <div class="live-stat-cell"><div class="live-stat-num">${h}</div><div class="live-stat-lbl">安打</div></div>
          <div class="live-stat-cell"><div class="live-stat-num">${hr}</div><div class="live-stat-lbl">全壘打</div></div>
          <div class="live-stat-cell"><div class="live-stat-num">${rbi}</div><div class="live-stat-lbl">打點</div></div>
          <div class="live-stat-cell"><div class="live-stat-num">${r}</div><div class="live-stat-lbl">得分</div></div>
          <div class="live-stat-cell"><div class="live-stat-num">${k}</div><div class="live-stat-lbl">三振</div></div>
          <div class="live-stat-cell"><div class="live-stat-num">${bb}</div><div class="live-stat-lbl">四壞</div></div>
          <div class="live-stat-cell"><div class="live-stat-num">${avg}</div><div class="live-stat-lbl">打擊率</div></div>
        </div>
      </div>
      ${plateAppearancesHtml}
      ${ohtaniPitchingHtml}
    </div>
  ` : '';

  return `
    <div class="live-card" id="liveCard">
      <div class="live-head">
        <span class="live-tag">LIVE</span>
        <span class="inning-info">${inning}局${inningHalfZh}半　${venueText}</span>
      </div>

      <div class="live-score-row">
        <div class="team-block">
          <div class="team-name">道奇</div>
          <div class="team-score">${dodgersScore}</div>
        </div>
        <svg class="diamond" viewBox="0 0 60 60" role="img" aria-label="壘上：${runnersLabel}">
          <rect class="base${onSecond ? ' on' : ''}" width="10" height="10" transform="translate(30 10) rotate(45) translate(-5 -5)"/>
          <rect class="base${onThird ? ' on' : ''}" width="10" height="10" transform="translate(10 30) rotate(45) translate(-5 -5)"/>
          <rect class="base${onFirst ? ' on' : ''}" width="10" height="10" transform="translate(50 30) rotate(45) translate(-5 -5)"/>
          <rect class="base" width="10" height="10" transform="translate(30 50) rotate(45) translate(-5 -5)"/>
        </svg>
        <div class="team-block right">
          <div class="team-name">${opponentZh}</div>
          <div class="team-score">${opponentScore}</div>
        </div>
      </div>

      <div class="bso" role="img" aria-label="${balls} 壞球 ${strikes} 好球 ${outs} 出局">
        <span class="bso-group"><span class="bso-label">B</span>${lamps(balls, 4, 'b')}</span>
        <span class="bso-group"><span class="bso-label">S</span>${lamps(strikes, 3, 's')}</span>
        <span class="bso-group"><span class="bso-label">出局</span>${lamps(outs, 3, 'o')}</span>
      </div>

      ${peopleHtml}
      ${ohtaniBoxHtml}
    </div>
  `;
}

async function renderNextGame(game) {
  const gameTime = new Date(game.gameDate);
  const isDodgersHome = game.teams.home.team.id === TEAM_ID;
  const dodgersTeam = isDodgersHome ? game.teams.home : game.teams.away;
  const opponentTeam = isDodgersHome ? game.teams.away : game.teams.home;
  const opponentZh = translateTeam(opponentTeam.team.name);
  const venueText = isDodgersHome ? '主場 vs' : '客場 @';

  const tw = gameTime.toLocaleString('zh-TW', {
    timeZone: 'Asia/Taipei',
    month: 'numeric',
    day: 'numeric',
    weekday: 'short',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });

  // 先發投手資訊
  const dodgersPitcher = dodgersTeam.probablePitcher;
  const opponentPitcher = opponentTeam.probablePitcher;

  // 抓兩位先發的本季成績（如果有的話）
  const fetchPitcherStats = async (pitcher) => {
    if (!pitcher?.id) return null;
    try {
      const res = await fetch(`https://statsapi.mlb.com/api/v1/people/${pitcher.id}/stats?stats=season&season=${SEASON}&group=pitching`);
      const data = await res.json();
      const stat = data.stats?.[0]?.splits?.[0]?.stat;
      if (!stat) return { name: pitcher.fullName };
      return {
        name: pitcher.fullName,
        wins: stat.wins ?? 0,
        losses: stat.losses ?? 0,
        era: stat.era ?? '0.00',
      };
    } catch {
      return { name: pitcher.fullName };
    }
  };

  const [dodgersInfo, opponentInfo] = await Promise.all([
    fetchPitcherStats(dodgersPitcher),
    fetchPitcherStats(opponentPitcher),
  ]);

  const renderPitcherSide = (info, team, alignRight) => {
    if (!info) {
      return `
        <div class="pitcher-side ${alignRight ? 'right' : ''}">
          <div class="pitcher-team">${team}</div>
          <div class="pitcher-name" style="opacity:0.7;">未公布</div>
        </div>
      `;
    }
    const record = (info.wins !== undefined)
      ? `${info.wins}勝${info.losses}敗 · ERA ${info.era}`
      : '';
    return `
      <div class="pitcher-side ${alignRight ? 'right' : ''}">
        <div class="pitcher-team">${team}</div>
        <div class="pitcher-name">${info.name}</div>
        ${record ? `<div class="pitcher-record">${record}</div>` : ''}
      </div>
    `;
  };

  const pitcherMatchupHtml = (dodgersPitcher || opponentPitcher) ? `
    <div class="pitcher-matchup">
      ${renderPitcherSide(dodgersInfo, '道奇 先發', false)}
      <div class="pitcher-vs">VS</div>
      ${renderPitcherSide(opponentInfo, `${opponentZh} 先發`, true)}
    </div>
  ` : '';

  return `
    <div class="next-game-card">
      <div class="next-game-label">下一場比賽</div>
      <div class="next-game-matchup">道奇 ${venueText} ${opponentZh}</div>
      <div class="countdown-row" id="countdown">
        <div class="countdown-cell"><div class="countdown-num" id="cd-d">--</div><div class="countdown-unit">天</div></div>
        <div class="countdown-cell"><div class="countdown-num" id="cd-h">--</div><div class="countdown-unit">時</div></div>
        <div class="countdown-cell"><div class="countdown-num" id="cd-m">--</div><div class="countdown-unit">分</div></div>
        <div class="countdown-cell"><div class="countdown-num" id="cd-s">--</div><div class="countdown-unit">秒</div></div>
      </div>
      <div class="next-game-time">台灣時間：${tw} 開打</div>
      ${pitcherMatchupHtml}
    </div>
  `;
}

function startCountdown(game) {
  const target = new Date(game.gameDate).getTime();
  const update = () => {
    const diff = target - Date.now();
    if (diff <= 0) {
      const cd = document.getElementById('countdown');
      if (cd) cd.innerHTML = '<div style="text-align:center; padding:8px; font-size:14px;">即將開打 / 比賽進行中</div>';
      clearInterval(countdownInterval);
      // 比賽應該開打了，重新整理整個畫面以便偵測即時比賽
      setTimeout(() => loadAll(), 60000);
      return;
    }
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    const setEl = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = String(val).padStart(2, '0'); };
    setEl('cd-d', days);
    setEl('cd-h', hours);
    setEl('cd-m', minutes);
    setEl('cd-s', seconds);
  };
  update();
  countdownInterval = setInterval(update, 1000);
}

async function renderRecentHistory(games) {
  // 平行抓所有比賽的 boxscore（取得大谷該場的成績）
  const boxscores = await Promise.all(
    games.map(g =>
      fetch(`https://statsapi.mlb.com/api/v1/game/${g.gamePk}/boxscore`)
        .then(r => r.json())
        .catch(() => null)
    )
  );

  const chartData = [];
  const rows = games.map((game, idx) => {
    const boxscore = boxscores[idx];
    const gameDate = new Date(game.gameDate);
    const dateStr = `${gameDate.getMonth() + 1}/${gameDate.getDate()}`;

    const isDodgersHome = game.teams.home.team.id === TEAM_ID;
    const opponentTeam = isDodgersHome ? game.teams.away.team : game.teams.home.team;
    const opponentZh = translateTeam(opponentTeam.name);
    const venueSymbol = isDodgersHome ? 'vs' : '@';

    const dodgersScore = isDodgersHome ? game.teams.home.score : game.teams.away.score;
    const opponentScore = isDodgersHome ? game.teams.away.score : game.teams.home.score;
    const won = dodgersScore > opponentScore;
    const resultText = `${won ? '勝' : '敗'} ${dodgersScore}-${opponentScore}`;

    let chartHits = 0;
    // 大谷該場概要（一行顯示用）
    let statsHtml = '<span class="history-dnp">未出賽</span>';
    let statsHighlight = false;

    if (boxscore) {
      const dodgersData = isDodgersHome ? boxscore.teams.home : boxscore.teams.away;
      const ohtani = dodgersData?.players?.[`ID${PLAYER_ID}`];

      if (ohtani) {
        const batting = ohtani.stats?.batting || {};
        const pitching = ohtani.stats?.pitching || {};
        const ab = batting.atBats ?? 0;
        const h = batting.hits ?? 0;
        const hr = batting.homeRuns ?? 0;
        const rbi = batting.rbi ?? 0;
        const bb = batting.baseOnBalls ?? 0;
        chartHits = h;

        const isPitcher = pitching && Object.keys(pitching).length > 0;

        if (isPitcher) {
          const ip = pitching.inningsPitched ?? '0';
          const pK = pitching.strikeOuts ?? 0;
          statsHtml = `${ip}局 K${pK}`;
          statsHighlight = pK >= 7;
        } else if (ab > 0 || bb > 0) {
          let parts = [`${ab}-${h}-${rbi}`];
          if (hr > 0) parts.push(`HR${hr > 1 ? hr : ''}`);
          statsHtml = parts.join(' ');
          statsHighlight = h >= 2 || hr > 0;
        }
      }
    }

    chartData.push({ dateStr, hits: chartHits, won });
    const detailId = `history-detail-${game.gamePk}`;
    const arrowId = `history-arrow-${game.gamePk}`;

    return `
      <div class="history-row" onclick="toggleHistoryDetail(${game.gamePk})">
        <div class="history-date">${dateStr}</div>
        <div class="history-matchup">${venueSymbol} ${opponentZh}</div>
        <div class="history-result ${won ? 'win' : 'loss'}">${resultText}</div>
        <div class="history-stats ${statsHighlight ? 'highlight' : ''}">${statsHtml}</div>
        <div class="history-arrow" id="${arrowId}">▾</div>
      </div>
      <div class="history-detail" id="${detailId}" data-loaded="false" data-game-pk="${game.gamePk}"></div>
    `;
  }).join('');

  const chartCols = chartData.slice().reverse();
  const maxHits = Math.max(3, ...chartCols.map(c => c.hits));
  const chartHtml = `
    <div class="legend"><span><i class="win"></i>勝</span><span><i></i>敗</span></div>
    <div class="chart" role="img" aria-label="最近 ${games.length} 場安打數">
      ${chartCols.map(c => `
        <div class="chart-col">
          <div class="chart-val">${c.hits}</div>
          <div class="chart-bar${c.won ? ' win' : ''}" style="height:${Math.round(c.hits / maxHits * 70) + 4}px"></div>
          <div class="chart-date">${c.dateStr}</div>
        </div>`).join('')}
    </div>
  `;

  return `
    <div class="panel-title">最近 ${games.length} 場</div>
    <div class="panel-sub">長條為大谷各場安打數，點下方列表可展開詳細數據</div>
    <div class="card">${chartHtml}</div>
    <div class="card">${rows}</div>
  `;
}

async function toggleHistoryDetail(gamePk) {
  const detail = document.getElementById(`history-detail-${gamePk}`);
  const arrow = document.getElementById(`history-arrow-${gamePk}`);
  if (!detail) return;

  const isOpen = detail.classList.contains('open');

  if (isOpen) {
    // 關閉
    detail.classList.remove('open');
    arrow?.classList.remove('open');
    return;
  }

  // 打開
  arrow?.classList.add('open');
  detail.classList.add('open');

  // 如果還沒載入過，就抓資料
  if (detail.dataset.loaded !== 'true') {
    detail.innerHTML = '<div class="history-loading">載入中...</div>';
    try {
      const html = await renderHistoryDetail(gamePk);
      detail.innerHTML = html;
      detail.dataset.loaded = 'true';
    } catch (err) {
      detail.innerHTML = '<div class="history-loading">載入失敗，請稍後再試</div>';
      console.error(err);
    }
  }
}

function extractStats(statsData) {
  let hittingStat = null;
  let pitchingStat = null;
  if (statsData?.stats) {
    for (const group of statsData.stats) {
      if (group.group?.displayName === 'hitting' && group.splits?.length > 0) {
        hittingStat = group.splits[0].stat;
      } else if (group.group?.displayName === 'pitching' && group.splits?.length > 0) {
        pitchingStat = group.splits[0].stat;
      }
    }
  }
  return { hittingStat, pitchingStat };
}

  const reg = extractStats(regularStatsData).hittingStat;
  const usePost = (ps?.gamesPlayed ?? 0) > 0;
  const s = usePost ? ps : reg;
  if (!s || (s.gamesPlayed ?? 0) === 0) return;
  document.getElementById('heroSub').textContent =
    `${SEASON} ${usePost ? '季後賽' : '例行賽'} ${s.gamesPlayed} 場`;
  document.getElementById('heroStats').innerHTML = `
    <div><div class="hero-stat-label">打擊率</div><div class="hero-stat-num">${s.avg ?? '--'}</div></div>
    <div><div class="hero-stat-label">OPS</div><div class="hero-stat-num">${s.ops ?? '--'}</div></div>
    <div><div class="hero-stat-label">全壘打</div><div class="hero-stat-num">${s.homeRuns ?? 0}</div></div>
  `;
}

function pctOf(value, max) {
  const n = parseFloat(value);
  if (isNaN(n)) return 0;
  return Math.max(0, Math.min(100, Math.round(n / max * 100)));
}

function renderSeasonBlock(hit, pit, id, active) {
  let html = `<div class="season-view${active ? ' active' : ''}" id="season-${id}">`;

  if (hit && (hit.gamesPlayed ?? 0) > 0) {
    html += `
      <div class="sub-head" style="margin-top:0;">打擊　${hit.gamesPlayed} 場</div>
      <div class="metric-row">
        <div class="metric"><div class="metric-label">打擊率</div><div class="metric-num">${hit.avg ?? '--'}</div></div>
        <div class="metric"><div class="metric-label">OPS</div><div class="metric-num">${hit.ops ?? '--'}</div></div>
      </div>
      <div class="bar-block">
        <div class="bar-top"><span>上壘率</span><span>${hit.obp ?? '--'}</span></div>
        <div class="bar"><i style="width:${pctOf(hit.obp, 0.6)}%"></i></div>
      </div>
      <div class="bar-block">
        <div class="bar-top"><span>長打率</span><span>${hit.slg ?? '--'}</span></div>
        <div class="bar"><i style="width:${pctOf(hit.slg, 1.0)}%"></i></div>
      </div>
      <div class="kv-grid">
        <div class="kv"><span>全壘打</span><span>${hit.homeRuns ?? 0}</span></div>
        <div class="kv"><span>安打</span><span>${hit.hits ?? 0}</span></div>
        <div class="kv"><span>打點</span><span>${hit.rbi ?? 0}</span></div>
        <div class="kv"><span>得分</span><span>${hit.runs ?? 0}</span></div>
        <div class="kv"><span>盜壘</span><span>${hit.stolenBases ?? 0}</span></div>
        <div class="kv"><span>三振</span><span>${hit.strikeOuts ?? 0}</span></div>
        <div class="kv"><span>四壞</span><span>${hit.baseOnBalls ?? 0}</span></div>
        <div class="kv"><span>打數</span><span>${hit.atBats ?? 0}</span></div>
      </div>
    `;
  }

  if (pit && (pit.gamesPlayed ?? 0) > 0) {
    html += `
      <div class="sub-head">投球　${pit.gamesPlayed} 場登板</div>
      <div class="metric-row">
        <div class="metric"><div class="metric-label">防禦率</div><div class="metric-num">${pit.era ?? '--'}</div></div>
        <div class="metric"><div class="metric-label">勝敗</div><div class="metric-num">${pit.wins ?? 0}-${pit.losses ?? 0}</div></div>
      </div>
      <div class="kv-grid">
        <div class="kv"><span>局數</span><span>${pit.inningsPitched ?? '0'}</span></div>
        <div class="kv"><span>WHIP</span><span>${pit.whip ?? '--'}</span></div>
        <div class="kv"><span>三振</span><span>${pit.strikeOuts ?? 0}</span></div>
        <div class="kv"><span>四壞</span><span>${pit.baseOnBalls ?? 0}</span></div>
      </div>
    `;
  }

  html += '</div>';
  return html;
}

function setStatsView(view) {
  statsView = view;
  document.querySelectorAll('.season-view').forEach(el => {
    el.classList.toggle('active', el.id === 'season-' + view);
  });
  document.querySelectorAll('.seg').forEach(el => {
    const on = el.dataset.view === view;
    el.classList.toggle('active', on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

function renderSeasonStats(regularStatsData, postseasonStatsData) {
  const ps = extractStats(postseasonStatsData);
  const reg = extractStats(regularStatsData);
  const hasPost = (ps.hittingStat?.gamesPlayed ?? 0) > 0 || (ps.pitchingStat?.gamesPlayed ?? 0) > 0;
  const hasReg = (reg.hittingStat?.gamesPlayed ?? 0) > 0 || (reg.pitchingStat?.gamesPlayed ?? 0) > 0;

  if (!hasPost && !hasReg) {
    return '<div class="card"><div class="error" style="padding:20px;">目前沒有可顯示的數據</div></div>';
  }

  const valid = (statsView === 'po' && hasPost) || (statsView === 'rs' && hasReg);
  if (!valid) statsView = hasPost ? 'po' : 'rs';

  let html = `<div class="panel-title">${SEASON} 球季數據</div><div class="panel-sub">來源：MLB Stats API</div>`;

  if (hasPost && hasReg) {
    html += `
      <div class="seg-row">
        <button class="seg${statsView === 'po' ? ' active' : ''}" data-view="po" aria-pressed="${statsView === 'po'}" onclick="setStatsView('po')">季後賽</button>
        <button class="seg${statsView === 'rs' ? ' active' : ''}" data-view="rs" aria-pressed="${statsView === 'rs'}" onclick="setStatsView('rs')">例行賽</button>
      </div>
    `;
  }

  if (hasPost) html += renderSeasonBlock(ps.hittingStat, ps.pitchingStat, 'po', statsView === 'po');
  if (hasReg) html += renderSeasonBlock(reg.hittingStat, reg.pitchingStat, 'rs', statsView === 'rs');
  return html;
}
